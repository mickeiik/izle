# Weekly version updates: one grouped pull request per ecosystem for minor and patch updates, one per major update.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: Deps
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Type-checking must catch APIs newer than the engine floor (Node 22.13), so @types/node stays on 22.x.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: Deps
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Actions are pinned by commit SHA with the release as a comment (`@<sha> # vX.Y.Z`); Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: Deps
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # No group: the Dockerfile's tags carry only the major (`node:24-slim`), so every update is a major one.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: Deps
