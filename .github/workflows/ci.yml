name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: { contents: read }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:server
      - run: npm run smoke:server

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t izle-server:ci .
      - name: Smoke-test the image offline, including restart with persisted data
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/izle-docker.json"
          python3 -c 'import json, sys; json.dump({"listen": {"host": "0.0.0.0", "port": 8787}, "dataDir": "/var/lib/izle", "appUpdates": {"source": "manual"}}, open(sys.argv[1], "w"))' "$config"
          docker run -d --name izle-ci --network none --health-interval 1s --health-start-period 5s \
            --mount type=bind,src="$config",dst=/etc/izle/izle.json,readonly \
            --mount type=volume,src=izle-ci-data,dst=/var/lib/izle izle-server:ci
          smoke() {
            docker exec izle-ci node --input-type=module -e '
              import assert from "node:assert/strict";
              assert.notEqual(process.getuid(), 0);
              assert.equal(process.versions.node.split(".")[0], "26");
              let ready = false;
              for (let i = 0; i < 60; i++) {
                try {
                  const response = await fetch("http://127.0.0.1:8787/healthz");
                  if (response.ok && (await response.json()).ok === true) { ready = true; break; }
                } catch {}
                await new Promise(resolve => setTimeout(resolve, 500));
              }
              assert.ok(ready, "server becomes healthy");
              assert.equal((await fetch("http://127.0.0.1:8787/admin/")).status, 200);
            '
          }
          smoke
          docker exec izle-ci node -e 'require("node:fs").writeFileSync("/var/lib/izle/smoke-marker", "persisted")'
          docker restart --time 10 izle-ci
          smoke
          docker exec izle-ci node -e 'require("node:assert/strict").equal(require("node:fs").readFileSync("/var/lib/izle/smoke-marker", "utf8"), "persisted")'
      - name: Container logs on failure
        if: failure()
        run: docker logs izle-ci 2>/dev/null || true
      - name: Clean up the container and volume
        if: always()
        run: |
          docker rm -f izle-ci || true
          docker volume rm izle-ci-data || true

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew --no-configuration-cache :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: izle-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
