name: Release

# A pushed tag vX.Y.Z publishes a GitHub release; a manual run is a dry run (artifacts only). See docs/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: { contents: read }

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Check that every version matches the tag
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/version.mjs check ${TAG:+--tag "$TAG"}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:server
      - run: npm run smoke:server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: izle-server, path: dist/izle-server-*.tgz, if-no-files-found: error }

  android:
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be tested in `if:` directly; the signed release APK is built only when a key is configured.
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew --no-configuration-cache :app:assembleDebug :core:testDebugUnitTest :app:testDebugUnitTest :companion:assembleDebug :companion:testDebugUnitTest
      - name: Signed release APKs
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          IZLE_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IZLE_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IZLE_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export IZLE_SIGNING_STORE_FILE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$IZLE_SIGNING_STORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$IZLE_SIGNING_STORE_FILE"
          ./gradlew --no-configuration-cache :app:assembleRelease :companion:assembleRelease
      - name: Name the APKs
        run: |
          version=$(node ../scripts/version.mjs check)
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/izle-tv-$version-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "../dist/izle-tv-$version.apk"
          fi
          cp companion/build/outputs/apk/debug/companion-debug.apk "../dist/izle-companion-$version-debug.apk"
          if [ -f companion/build/outputs/apk/release/companion-release.apk ]; then
            cp companion/build/outputs/apk/release/companion-release.apk "../dist/izle-companion-$version.apk"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: izle-android, path: dist/*.apk, if-no-files-found: error }

  release:
    needs: [server, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist, merge-multiple: true }
      - name: Checksums and release notes
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          signed=""
          signed_companion=""
          for apk in dist/izle-tv-*.apk dist/izle-companion-*.apk; do
            case "$apk" in
              *-debug.apk) ;;
              dist/izle-companion-*) signed_companion=yes ;;
              *) signed=yes ;;
            esac
          done
          {
            echo "## Downloads"
            echo
            echo "- \`izle-server-*.tgz\`: the server (Node.js 22.13 or newer, no other dependencies). Install it with"
            echo "  \`npm install --global --prefix /opt/izle ./izle-server-<version>.tgz\` as described in the"
            echo "  [self-hosting guide](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/deploy/self-hosting.md)."
            if [ -n "$signed" ]; then
              echo "- \`izle-tv-<version>.apk\`: the Android TV app, signed with the release key. Use this one on a TV;"
              echo "  later releases install over it."
            fi
            echo "- \`izle-tv-<version>-debug.apk\`: debug build for trying izle and for the emulator. It is signed with a"
            echo "  throwaway key, so a later APK cannot be installed over it: uninstall it first (the TV pairs again)."
            if [ -n "$signed_companion" ]; then
              echo "- \`izle-companion-<version>.apk\`: izle companion, the phone app for Listen along, signed with the"
              echo "  release key. Sideload it on the owner's Android phone; later releases install over it. A server's"
              echo "  TV app updates ignore it."
            fi
            echo "- \`izle-companion-<version>-debug.apk\`: izle companion's debug build, signed with a throwaway key like"
            echo "  the TV's debug build (uninstall it before installing another build)."
            echo "- \`SHA256SUMS\`: checksums of the files above."
            echo
            echo "What izle is, with screenshots: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          } > notes.md
          cat notes.md
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "izle $TAG" \
            --notes-file notes.md --generate-notes $prerelease
